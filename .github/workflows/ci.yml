name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    # ADR 0015 trial: invoke capability-based central CI
    # This repository requires only the Documentation capability
    uses: Mikode13/.github/.github/workflows/ci.yml@PLACEHOLDER_SHA
    with:
      # Capability selection per CI standard capability table:
      # - Documentation: YES (content-only repository with Markdown artifacts)
      # - Source: NO (no executable source code)
      # - Tests: NO (no mandatory test suite)
      # - Build: NO (no build output)
      # - Package: NO (not an npm package)
      # - End-to-end: NO (not an application)
      capabilities: "documentation"
      # Alternatively, a preset could be used when defined by central workflow:
      # preset: "docs-content-only"
    secrets: inherit
