name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: Mikode13/.github/.github/workflows/ci.yml@7de844406ef0a416ff51bb0440bcce0722a327ed
    with:
      documentation: true
      documentation_plugin_versions: true
