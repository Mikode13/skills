name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: Mikode13/.github/.github/workflows/ci.yml@b682c98075a68c9041f1efbf0dbe5a927e688d3f
    with:
      documentation: true
      documentation_plugin_versions: true
