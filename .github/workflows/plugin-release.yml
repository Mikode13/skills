name: Plugin release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push CI run ID to retry.
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: Mikode13/.github/.github/workflows/plugin-release.yml@b682c98075a68c9041f1efbf0dbe5a927e688d3f
    with:
      ci_run_id: ${{ inputs.ci_run_id || format('{0}', github.event.workflow_run.id) }}
